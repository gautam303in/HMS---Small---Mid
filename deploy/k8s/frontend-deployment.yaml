apiVersion: apps/v1
kind: Deployment
metadata:
  name: hms-frontend
  namespace: default
  labels:
    app: hms-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hms-frontend
  template:
    metadata:
      labels:
        app: hms-frontend
    spec:
      containers:
      - name: frontend
        image: grandazureacr.azurecr.io/hms-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hms-frontend-service
  namespace: default
spec:
  selector:
    app: hms-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
