name: HMS CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Validate Modules
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Build & Test Backend
      run: |
        cd backend
        npm ci
        npm run build
        npm test

    - name: Build Frontend (Vite)
      run: |
        cd frontend
        npm ci
        npm run build

  docker-build-push:
    name: Containerize & Push to Azure ACR
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.AZURE_REGISTRY_SERVER }}
        username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
        password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

    - name: Build & Push Backend Image
      run: |
        docker build -t ${{ secrets.AZURE_REGISTRY_SERVER }}/hms-backend:${{ github.sha }} -t ${{ secrets.AZURE_REGISTRY_SERVER }}/hms-backend:latest -f deploy/docker/Dockerfile.backend .
        docker push ${{ secrets.AZURE_REGISTRY_SERVER }}/hms-backend:latest

    - name: Build & Push Frontend Image
      run: |
        docker build -t ${{ secrets.AZURE_REGISTRY_SERVER }}/hms-frontend:${{ github.sha }} -t ${{ secrets.AZURE_REGISTRY_SERVER }}/hms-frontend:latest -f deploy/docker/Dockerfile.frontend .
        docker push ${{ secrets.AZURE_REGISTRY_SERVER }}/hms-frontend:latest

    - name: Deploy to Azure AKS (Kubernetes)
      uses: azure/k8s-deploy@v4
      with:
        manifests: |
          deploy/k8s/backend-deployment.yaml
          deploy/k8s/frontend-deployment.yaml
          deploy/k8s/ingress.yaml
        images: |
          ${{ secrets.AZURE_REGISTRY_SERVER }}/hms-backend:latest
          ${{ secrets.AZURE_REGISTRY_SERVER }}/hms-frontend:latest
